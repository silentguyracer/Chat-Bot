<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.7);
      --bubble-bot: rgba(30, 41, 59, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient animated lighting */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.22;
      animation: floatOrb 20s ease-in-out infinite alternate;
    }
    .orb-1 { width: 550px; height: 550px; background: #3b82f6; top: -120px; left: -100px; }
    .orb-2 { width: 600px; height: 600px; background: #8b5cf6; bottom: -150px; right: -120px; animation-delay: -10s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.08); }
      100% { transform: translate(-40px, 70px) scale(0.95); }
    }

    /* Clean Navbar */
    header {
      position: relative;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #4ade80;
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .nav-actions {
      display: flex;
      gap: 10px;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* Main Container (Clean Centered Chat App) */
    .app-container {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 24px 20px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    .chat-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: calc(100vh - 130px);
    }

    /* Message Stream */
    .messages-container {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .msg-wrapper {
      display: flex;
      gap: 14px;
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .msg-user-wrapper { justify-content: flex-end; }
    .msg-bot-wrapper { justify-content: flex-start; }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(14px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .avatar-bot {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      box-shadow: 0 0 14px var(--primary-glow);
    }
    .avatar-user {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
    }

    .msg-bubble {
      max-width: 75%;
      padding: 14px 20px;
      border-radius: 18px;
      font-size: 0.98rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-bot {
      background: var(--bubble-bot);
      border: 1px solid var(--border);
      color: #f1f5f9;
      border-top-left-radius: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }
    .bubble-user {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border-top-right-radius: 4px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    }

    /* Typing Indicator Waveform */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 20px;
      background: var(--bubble-bot);
      border: 1px solid var(--border);
      border-radius: 18px;
      border-top-left-radius: 4px;
      width: fit-content;
    }
    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #60a5fa;
      animation: wave 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes wave {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-7px); }
    }

    /* Quick suggestions bar */
    .quick-bar {
      padding: 12px 28px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      background: rgba(15, 23, 42, 0.4);
      border-top: 1px solid var(--border);
      scrollbar-width: none;
    }
    .quick-bar::-webkit-scrollbar { display: none; }

    .pill {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: #93c5fd;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .pill:hover {
      background: rgba(59, 130, 246, 0.25);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* Input Bar */
    .input-bar {
      padding: 18px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 14px;
      background: rgba(15, 23, 42, 0.6);
      align-items: center;
    }

    .chat-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 14px 24px;
      color: #fff;
      font-size: 0.98rem;
      outline: none;
      font-family: inherit;
      transition: all 0.25s ease;
    }
    .chat-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
      background: rgba(15, 23, 42, 0.95);
    }
    .chat-input::placeholder {
      color: #64748b;
    }

    .send-btn {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border: none;
      color: white;
      padding: 0 24px;
      height: 48px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px var(--primary-glow);
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--primary-glow);
    }
    .send-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Animated Particle Canvas Background -->
  <canvas id="particleCanvas"></canvas>
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">🤖</div>
      <div class="brand-text">
        <h1>Smart Assistant</h1>
        <div class="status-badge">
          <div class="status-dot"></div>
          <span>Online & Ready to Help</span>
        </div>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn-reset" id="resetBtn" title="Start a fresh conversation">
        <span>🔄</span>
        <span>New Chat</span>
      </button>
    </div>
  </header>

  <!-- Clean Full-Width Chat Container -->
  <div class="app-container">
    <div class="chat-card">
      
      <!-- Messages Stream -->
      <div class="messages-container" id="messagesContainer">
        <div class="msg-wrapper msg-bot-wrapper">
          <div class="msg-avatar avatar-bot">🤖</div>
          <div class="msg-bubble bubble-bot">👋 Hello! How can I assist you today? Feel free to ask about our business hours, location, pricing, or book a reservation!</div>
        </div>
      </div>

      <!-- Quick Action Suggestions -->
      <div class="quick-bar">
        <button class="pill" data-text="What are your business hours?">🕒 Business Hours</button>
        <button class="pill" data-text="Where are you located?">📍 Location & Address</button>
        <button class="pill" data-text="What is your pricing?">💲 Pricing & Services</button>
        <button class="pill" data-text="I want to book an appointment">📅 Book an Appointment</button>
      </div>

      <!-- User Input Bar -->
      <div class="input-bar">
        <input 
          type="text" 
          id="chatInput" 
          class="chat-input" 
          placeholder="Ask anything or schedule a booking..." 
          autocomplete="off" 
          autofocus
        />
        <button id="sendBtn" class="send-btn">
          <span>Send</span>
          <span>➔</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Animated Background Canvas -->
  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 2 + 1;
        this.alpha = Math.random() * 0.4 + 0.15;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(96, 165, 250, ${this.alpha})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>

  <!-- Clean Front-End Chat Logic -->
  <script>
    const messagesContainer = document.getElementById('messagesContainer');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');

    let sessionId = 'user_' + Math.random().toString(36).substring(2, 9);

    function appendMessage(text, isUser = false) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${isUser ? 'msg-user-wrapper' : 'msg-bot-wrapper'}`;
      
      const avatar = document.createElement('div');
      avatar.className = `msg-avatar ${isUser ? 'avatar-user' : 'avatar-bot'}`;
      avatar.textContent = isUser ? '👤' : '🤖';

      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isUser ? 'bubble-user' : 'bubble-bot'}`;
      bubble.textContent = text;

      if (isUser) {
        wrapper.appendChild(bubble);
        wrapper.appendChild(avatar);
      } else {
        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
      }

      messagesContainer.appendChild(wrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function showTypingIndicator() {
      const typingEl = document.createElement('div');
      typingEl.id = 'typingIndicator';
      typingEl.className = 'msg-wrapper msg-bot-wrapper';
      typingEl.innerHTML = `
        <div class="msg-avatar avatar-bot">🤖</div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      messagesContainer.appendChild(typingEl);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    async function sendMessage(text) {
      const msg = (text || chatInput.value).trim();
      if (!msg) return;

      appendMessage(msg, true);
      chatInput.value = '';
      showTypingIndicator();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, session_id: sessionId })
        });

        removeTypingIndicator();

        if (!res.ok) {
          appendMessage("I'm sorry, I encountered an issue processing that. Please try again.");
          return;
        }

        const data = await res.json();
        appendMessage(data.response);
      } catch (err) {
        removeTypingIndicator();
        appendMessage("Unable to connect to the server right now. Please check your connection.");
      }
    }

    sendBtn.addEventListener('click', () => sendMessage());
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Quick suggestion pills click
    document.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', (e) => {
        const text = e.target.getAttribute('data-text');
        if (text) sendMessage(text);
      });
    });

    // New Chat Button
    resetBtn.addEventListener('click', () => {
      sessionId = 'user_' + Math.random().toString(36).substring(2, 9);
      messagesContainer.innerHTML = `
        <div class="msg-wrapper msg-bot-wrapper">
          <div class="msg-avatar avatar-bot">🤖</div>
          <div class="msg-bubble bubble-bot">👋 Hello! How can I assist you today? Feel free to ask about our business hours, location, pricing, or book a reservation!</div>
        </div>
      `;
      chatInput.focus();
    });
  </script>
</body>
</html>
